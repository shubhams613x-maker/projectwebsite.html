<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: grid;
  grid-template-columns: 5fr 2fr;
  gap: 5px;
  background-color: dodgerblue;
  padding: 5px;
}
.container div {
  background-color: #f1f1f1;
  padding: 10px;
  text-align: center;
}
</style>
</head>
<body>

<h1>The fr Unit</h1>

<p>The fr unit is a fractional unit. 1fr equals 1 part of the available space.</p>

<div class="container">
  <div>1fr</div>
  <div>2fr</div>
</div>

</body>
</html>
