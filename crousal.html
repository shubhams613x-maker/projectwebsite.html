<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Categories</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial;
    }

    body {
        background: #f7f7f7;
    }

    .category-section {
        width: 60%;
        padding: 160px 0;
        margin-left: 420px;
    }

    .category-section h2 {
        text-align: center;
        margin-bottom: 35px;
        font-size: 40px;
        font-weight: 700;
    }

    .marquee {
        overflow: hidden;
        width: 100%;
        margin: 18px 0;
    }

    .track {
        display: flex;
        width: max-content;
        gap: 18px;
    }

    .left .track {
        animation: scrollLeft 25s linear infinite;
    }

    .right .track {
        animation: scrollRight 25s linear infinite;
    }

    .card {

        min-width: 300px;
        height: 110px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        transition: .3s;
        cursor: pointer;
        text-align: center;
    }

    .card:hover {

        transform: translateY(-8px);

        box-shadow: 0 10px 30px rgba(0, 0, 0, .15);

    }

    .card img {

        width: 38px;
        height: 38px;
        object-fit: contain;

    }

    .card span {

        font-size: 24px;
        font-weight: 600;

    }

    @keyframes scrollLeft {

        0% {
            transform: translateX(0);
        }

        100% {
            transform: translateX(-50%);
        }

    }

    @keyframes scrollRight {

        0% {
            transform: translateX(-50%);
        }

        100% {
            transform: translateX(0%);
        }

    }



    .category-slider {
        position: relative;
        width: 100%;
    }

    .slider-btn {
        position: absolute;
        top: 50%;
        transform: translateX(-50%);
        width: 50px;
        height: 50px;
        border: none;
        border-radius: 50%;
        background: rgba(0, 0, 0, .6);
        color: #fff;
        font-size: 30px;
        cursor: pointer;
        z-index: 999;
        transition: .3s;
    }

    .slider-btn:hover {
        background: #000;
    }

    .prev {
        left: 280px;
    }

    .next {
        right: 190px;
    }
</style>
