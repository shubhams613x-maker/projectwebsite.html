<!DOCTYPE html>
<html>

<head>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: auto auto auto auto;
        
            grid-gap: 20px;

            padding: 10px;
        }

        .grid-container div {

            text-align: center;
          
            font-size: 30px;
        }
    </style>
</head>

<body>

    <h1>The grid-template-rows Property</h1>

    <p>Use the <em>grid-template-rows</em> property to define the size of the rows in a grid layout.</p>
    <p>The first row in this grid is 100px high, and the second row is 300px high:</p>

    <div class="grid-container">
        <div class="item1"><img src="images/bootstrap.png" alt=""></div>
        <div class="item2"><img src="images/bootstrap.png" alt=""></div>
        <div class="item3"><img src="images/bootstrap.png" alt=""></div>
        <div class="item4"><img src="images/bootstrap.png" alt=""></div>
        <div class="item5"><img src="images/bootstrap.png" alt=""></div>
        <div class="item6"><img src="images/bootstrap.png" alt=""></div>
        <div class="item7"><img src="images/bootstrap.png" alt=""></div>
        <div class="item8"><img src="images/bootstrap.png" alt=""></div>
    </div>

</body>

</html>
