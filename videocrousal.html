<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .carousel-item video,
    .carousel-item img {
        width: 100%;
        height: 100vh;
        object-fit: cover;
    }
</style>

<body>
    <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel" style="background-color: black;">

        <div class="carousel-inner">

            <!-- Video Slide -->
            <div class="carousel-item active">
                <video class="d-block w-100" autoplay muted loop playsinline>
                    <source src="videos/WhatsApp Video 2026-07-24 at 12.44.32 PM.mp4" type="video/mp4">
                </video>
            </div>

            <!-- Image Slide -->
            <div class="carousel-item">
                <img src="images/116577.jpg" class="d-block w-100" alt="Slide 2">
            </div>

            <!-- Image Slide -->
            <div class="carousel-item">
                <img src="images/116577.jpg" class="d-block w-100" alt="Slide 3">
            </div>

        </div>

        <!-- Previous -->
        <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <!-- Next -->
        <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>
</body>

</html>
