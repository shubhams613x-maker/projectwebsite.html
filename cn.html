<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .body {
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
        }

        .navbar-selector img {
            height: 50px;
            width: 50px;
            border-radius: 50%;
        }

        .navbar-selector {
            background-color: aquamarine;
            display: flex;
            align-items: center;
            justify-content: space-around;
            height: 100%;
            width: 100%;
        }

        .menubar ul {
            display: flex;
            justify-content: space-between;
        }

        .menubar ul li {
            list-style: none;
            margin: 10px;
        }

        .header-container {
            background-color: blue;
            width: 100%;
            height: 600px;
            text-align: center;
            align-items: center;
            position: fixed;



        }

        .com {
            display: flex;
            align-items: center;
            justify-content: space-around;
            text-align: center;
            background-color: black;
            align-self: center;
            margin-top: 90px;

        }

        .header-back-img img {
            width: 200px;
            height: 200px;
        }

        .header-content {
            width: 200px;
            height: 200px;
            color: white;
            font-weight: bold;

        }
    </style>
</head>

<body>
    <!-- navbar -->
    <div class="navbar">
        <div class="navbar-selector">
            <img src="Images/youtube.jpg" alt="">
            <!-- unorderedlist  -->
            <div class="menubar">
                <ul>
                    <li>Home</li>
                    <li>contact</li>
                    <li>About</li>
                </ul>
            </div>
            <div class="button">
                <button>sign up</button>
            </div>
        </div>
    </div>
    <!-- header section  -->
    <div class="header-container">
        <div class="com">
            <div class="headermain">

                <img src="Images/goal2.png" alt="">
            </div>
            <div class="header-content">
                <h1>Lorem ipsum dolor sit amet.</h1>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ipsum, non!</p>
                <button>learn here</button>
            </div>
        </div>


    </div>
</body>

</html>
