    <!DOCTYPE html>
    <html lang="en">

    <head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: Arial, Helvetica, sans-serif;
        }

        .slider {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Slides */

        .slides {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: .6s;
        }

        .slide.active {
            opacity: 1;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Bottom Navigation */

        .thumbnails {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);

            display: flex;
            gap: 15px;

            background: rgba(0, 0, 0, .5);
            padding: 10px 15px;
            border-radius: 15px;
            backdrop-filter: blur(8px);
        }

        .thumb {
            width: 120px;
            height: 70px;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            opacity: .5;
            transition: .4s;
            border: 2px solid transparent;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .thumb.active {
            opacity: 1;
            border: 2px solid #fff;
        }


        .slide video,
        .thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide video {
            width: 100%;
            height: 100vh;
        }

        .thumb {
            width: 140px;
            height: 80px;
            overflow: hidden;
            border-radius: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: Arial, Helvetica, sans-serif;
        }

        .slider {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Main Slides */

        .slides {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity .6s ease-in-out;
        }

        .slide.active {
            opacity: 1;
            z-index: 1;
        }

        .slide video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Bottom Video Navigation */

        .thumbnails {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            padding: 12px 15px;
            background: rgba(0, 0, 0, .45);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            z-index: 100;
        }

        .thumb {
            width: 140px;
            height: 80px;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: .3s;
            opacity: .6;
        }

        .thumb:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .thumb.active {
            opacity: 1;
            border: 2px solid #fff;
        }

        .thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* Mobile */

        @media(max-width:768px) {

            .thumb {
                width: 90px;
                height: 55px;
            }

            .thumbnails {
                gap: 10px;
                padding: 8px 10px;
            }
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: .5s;
        }

        .slide.active {
            opacity: 1;
            z-index: 1;
        }
    </style>

    <body>

        <div class="slider">

            <!-- Slides -->
            <div class="slides">
                <div class="slide active">
                    <video autoplay muted loop playsinline>
                        <source src="videos/WhatsApp Video 2026-07-24 at 12.44.32 PM.mp4" type="video/mp4">

                    </video>
                </div>

                <div class="slide">
                    <video autoplay muted loop playsinline>
                        <source src="videos/WhatsApp Video 2026-07-24 at 9.24.51 PM.mp4" type="video/mp4">

                    </video>
                </div>

                <div class="slide">
                    <video autoplay muted loop playsinline>
                        <source src="videos/WhatsApp Video 2026-07-24 at 9.24.56 PM.mp4" type="video/mp4">

                    </video>
                </div>
            </div>

            <!-- Bottom Navigation -->
            <div class="thumbnails">

                <div class="thumb active">
                    <video autoplay muted loop playsinline>
                        <source src="videos/WhatsApp Video 2026-07-24 at 12.44.32 PM.mp4" type="video/mp4">

                    </video>
                </div>

                <div class="thumb">
                    <video autoplay muted loop playsinline>
                        <source src="videos/WhatsApp Video 2026-07-24 at 9.24.51 PM.mp4" type="video/mp4">

                    </video>
                </div>

                <div class="thumb">
                    <video autoplay muted loop playsinline>
                        <source src="videos/WhatsApp Video 2026-07-24 at 9.24.56 PM.mp4" type="video/mp4">

                    </video>
                </div>

            </div>


            <div class="navigation">

                <span class="prev">&#10094;</span>

                <span class="next">&#10095;</span>

            </div>

        </div>




        <script>



            const slides = document.querySelectorAll(".slide");
            const thumbs = document.querySelectorAll(".thumb");

            thumbs.forEach((thumb, index) => {
                thumb.addEventListener("click", () => {

                    // Remove active class
                    slides.forEach(slide => slide.classList.remove("active"));
                    thumbs.forEach(item => item.classList.remove("active"));

                    // Add active class
                    slides[index].classList.add("active");
                    thumbs[index].classList.add("active");
                });
            });
        </script>

    </body>
