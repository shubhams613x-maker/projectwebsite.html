<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAVBAR</title>
</head>
<style>
    body {
        margin: 0px;
        padding: 0px;
    }

    .navbar {

        display: flex;
        background-color:blue;

        justify-content: space-around;
        align-items: center;
        



    }

    .navbar img {
        height: 190px;
        width: 190px;
    }

    .type {
        font-size: xx-large;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;



        display: flex;
        color: white;
        justify-content: center;
        list-style: none;
        font-weight: bold;

        font-style: oblique;



    }

    .type:hover {
        background-color: black;

    }

    .type li {
        padding-left: 80px;
        
    }

    .b {
        background-color: wheat;
        color: black;
        width: 180px;
        height: 50px;
        border: none;
        font-weight: bolder;
        font-size: large;
    }
</style>

<body>
    <nav class="navbar">
        <img src="images/pizza time.png" alt="">
        <ul class="type">
            <li>Home</li>
            <li>Contact</li>
            <li>Name</li>
            <li>None</li>
        </ul>


        <button class="b">click this button</button>
    </nav>

</body>

</html>
