<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Support Table</title>

    <style>
        table {
            width: 850px;
            border-collapse: collapse;
            text-align: center;
            font-family: "Times New Roman", serif;
            justify-content: center;
            justify-content: space-around;
            text-align: center;
            transform: translate(460px, 200px);
            background-color: #d60707;
            color: white;

        }

        th,
        td {
            border: 4px solid #dcdf84;
            padding: 15px;
        }

        th {
            font-size: 22px;
            font-weight: bold;
        }

        .heading {
            font-size: 31px;
            font-weight: bold;
        }

        .property {

            font-weight: bold;

        }
    </style>
</head>

<body>

    <table class="fourth-section">
        <tr>
            <th colspan="6" class="heading">
                CSS3 Browser Support (latest browser versions)
            </th>
        </tr>

        <tr>
            <th>CSS Property</th>
            <th>Internet Explorer</th>
            <th>FireFox</th>
            <th>Chrome</th>
            <th>Safari</th>
            <th>Opera</th>
        </tr>

        <tr>
            <td class="property">Border Radius</td>
            <td>YES</td>
            <td>YES</td>
            <td>YES</td>
            <td>YES</td>
            <td>YES</td>
        </tr>

        <tr>
            <td class="property">Box Shadow</td>
            <td>YES</td>
            <td>YES</td>
            <td>YES</td>
            <td>YES</td>
            <td>YES</td>
        </tr>

        <tr>
            <td class="property">CSS Animations</td>
            <td>NO</td>
            <td>NO</td>
            <td>YES</td>
            <td>YES</td>
            <td>NO</td>
        </tr>
    </table>

</body>

</html>
