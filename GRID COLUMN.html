<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .shubham {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        /* Remove space between grid items */
        width: 100%;
    }

    .item1,
    .item2,
    .item3,
    .item4 {
        margin: 0;
        padding: 0;
    }

    .shubham img {
        width: 100%;
        height: 100%;
        display: block;
        /* Removes default inline image gap */
        margin: 0;
        padding: 0;
        object-fit: cover;
    }

    /* Mobile */
    @media screen and (max-width:767px) {
        .shubham {
            grid-template-columns: 1fr;
            gap: 0;
        }
    }
</style>

<body>
    <div class="shubham">
        <div class="item1"><img src="images/img_5terre.jpg" alt=""></div>
        <div class="item2"><img src="images/img_5terre.jpg" alt=""></div>
        <div class="item3"><img src="images/img_5terre.jpg" alt=""></div>
        <div class="item4"><img src="images/img_5terre.jpg" alt=""></div>
    </div>
</body>

</html>
