<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<style>
    .header-fourth {
        font-family: 'Montserrat', sans-serif;
        font-weight: bolder;
        font-size: 40px;
        padding: 10px;
        background-color: #fb2056;
        animation-name: mymove;
        animation-duration: 2s;
        width: 300px;
        transform: skew(40deg, 10deg);

    }

    @keyframes mymove {
        from {
            background-color: #3920fb;

        }

        to {
            background-color: #40e248;

        }
    }
</style>
