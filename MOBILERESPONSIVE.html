            font-size: 24px;
            line-height: 1.4;
        }

        .tooltiptext {
            visibility: hidden;
            position: absolute;
            bottom: 110%;

            color: #fff;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 14px;
            white-space: normal;
            width: 220px;

        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            background: #fb2056;
