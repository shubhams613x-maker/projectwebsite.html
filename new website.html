<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {


        margin: 0%;
        padding: 0%;

    }

    .navbar {

        width: 100%;
        background-color: rgb(0, 0, 0);
        display: flex;
        justify-content: center;
        align-items: center;
        justify-content: space-between;
        justify-content: space-around;



    }

    .navbar img {



        width: 80px;
        height: 80px;
    }

    .nav {


        display: flex;

    }

    ul li {


        text-decoration: none;
        align-items: center;
        list-style: none;
        padding: 4px;
        margin-left: 80px;
        color: white;
        font-style: italic;


    }

    button {


        background-color: red;
        width: 80px;
        height: 26px;
        border: none;
        color: white;
        border-radius: 10px;
    }

    .com {


        display: flex;

    }

    .second-section {

        background-image: url("images/bg/ middle.jpg");
        width: 100%;
        background-color: aliceblue;
        justify-content: center;
        justify-content: space-between;
        text-align: center;
        align-items: center;
        margin-top: 20px;

    }

    .second-flex {

        display: flex;
        justify-content: center;
        text-align: center;
        align-items: center;
    }

    .form-section {
        background-image: url("images/bg/ middle.jpg");
        width: 100%;
        background-color: aliceblue;
        justify-content: center;
        justify-content: space-between;
        text-align: center;
        align-items: center;
        margin-top: 20px;


    }

    .dom {

        display: flex;
        justify-content: center;
        text-align: center;
        align-items: center;

    }

    .input-box {
        width: 400px;
        /* Increase width */
        padding: 10px;
    }
</style>

<body>

    <div class="navbar">

        <img src="images/navi logo.jpg" alt="" style="width: 90px; height:80px;">
        <nav>



            <ul class="com">

                <li>home</li>
                <li>about</li>
                <li>instruction</li>
                <li>click</li>


            </ul>






        </nav>


        <button>click here</button>

    </div>



    <div class="second-section">

        <div class="second-flex">

            <div image-section>


                <img src="images/5453.jpg" alt="" style="width: 800px; height: 800px;">
            </div>



            <div class="heading-section "
                style="text-align: center;align-items: center; padding-left: 8px; font-style: italic; padding: 8px 10px; color: rgb(0, 0, 0);">


                Lorem ipsum dolor sit amet consectetur adipisicing elit. <br>
                Porro adipisci aliquid inventore <br>
                non temporibus eius, vel facilis veniam laudantium, error reiciendis nihil <br>
                ipsa at quam voluptate repudiandae et rerum architecto! <br>



                <button class="pop" style="margin-top: 5px;">click</button>
            </div>






        </div>








    </div>


    <div class="form-section">
        <div class="dom">




            <div class="image-section">
                <img src="images/Feature-image-12-Most-Effective-Web-Form-Examples-to-Explore-1.webp" alt=""
                    style="width: 800px; height: 800px;">
            </div>


            <div class="frm"
                style="text-align: center;align-items: center; padding-left: 8px; font-style: italic; padding: 8px 10px;">
                <form  style=" font-style: italic; padding: 8px 26px;">


                    <label for="NAME"></label>
                    <br>
                    <input class="input-box" type="text" placeholder="Enter your name">
                    <br>
                    <!-- Email input -->
                    <label for="EMAIL"></label>
                    <br>
                    <input class="input-box" type="email" placeholder="Enter your email">

                    <br>
                    <!-- Password input -->
                    <label for="PASSWORD"></label>
                    <br>
                    <input class="input-box" type="password" placeholder="Password">

                    <br>
                    <br>
                    <!-- Submit button -->
                    <input  action="https://formsubmit.co/"  class="input-box" type="submit" value="Submit"
                        style="background-color: red; color: white; border:none" >





                </form>

            </div>
        </div>

    </div>


    






</body>

</html>
